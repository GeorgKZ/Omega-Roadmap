<!DOCTYPE html>
<html><head meta charset="UTF-8">
<title>Системная плата и плата клавиатуры</title>
<link rel="stylesheet" href="./styles.css">

<style>

html {
  scroll-behavior: smooth;
}

/* Свойства якорного (при переходе по его ID) элемента rect в элементе svg */
svg rect:target {
  /* Запуск анимационной последовательности */
  animation: svg_animation 2s ease-in-out;
  /* Свойства после окончания анимации */
  fill: grey;
  fill-opacity: 0.8;
  stroke: black;
  stroke-opacity: 1.0;
}

/* Анимация цвета фона и обрамления, их прозрачностей */
@keyframes svg_animation {
    /* Начинаем с прозрачного заполнения */
    0%   {
           fill: yellow;
           fill-opacity: 0;
           stroke: black;
           stroke-opacity: 0;
         }
    /* 0 % - 30 % - жёлтый фон появляется */
    30%  {
           fill: yellow;
           fill-opacity: 0.8;
           stroke: black;
           stroke-opacity: 1;
         }
    /* 30 % - 60 % - жёлтый фон сохраняется */
    60%  {
           fill: yellow;
           fill-opacity: 0.8;
           stroke: black;
           stroke-opacity: 0.8;
         }
    /* 60 % - 100 % - жёлтый фон плавно исчезает, сменяясь слабым серым */
    100% {
           fill: grey;
           fill-opacity: 0.8;
           stroke: black;
           stroke-opacity: 1.0;
         }
}

</style>

<script type="text/javascript" src="script.js"></script>

</head>
<body>


<h2>Чертёж системной платы</h2>

<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
  id="svg_mainboard"
  onload='onLoad_mainboard(this, 338)'
  width="1200px" height="600px"
>
  <image xlink:href="mainboard.svg" width="100%" />
</svg>

<h2>Чертёж платы клавиатуры</h2>

<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
  id="svg_keyboard"
  onload='onLoad_keyboard(this, 338)'
  width="1200px" height="600px"
>

  <image xlink:href="keyboard.svg" width="100%" />
</svg>

</body>
</html>
